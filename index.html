<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Registration</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #5f6b7a;
            --line: #d8dee8;
            --accent: #1d6f8f;
            --accent-dark: #14516a;
            --surface: #ffffff;
            --background: #eef4f6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            color: var(--ink);
            background: linear-gradient(135deg, #e8f3f2, var(--background));
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            width: min(760px, 100%);
            margin: 0 auto;
            padding: 36px;
            background: var(--surface);
            border: 1px solid #dce7e9;
            border-top: 6px solid var(--accent);
            box-shadow: 0 14px 35px rgb(23 32 51 / 10%);
        }

        h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3rem); }

        .intro {
            margin: 0 0 28px;
            color: var(--muted);
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        fieldset {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 20px;
            margin: 0 0 24px;
            padding: 20px;
            border: 1px solid var(--line);
        }

        legend { padding: 0 8px; color: var(--accent-dark); font-size: 1.15rem; font-weight: bold; }
        .full-width { grid-column: 1 / -1; }

        label {
            display: block;
            margin-bottom: 7px;
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 12px;
            color: var(--ink);
            background: #fbfcfd;
            border: 1px solid #bbc6d2;
            border-radius: 4px;
            font: 1rem Arial, sans-serif;
        }

        input:focus, select:focus, textarea:focus {
            outline: 3px solid rgb(29 111 143 / 20%);
            border-color: var(--accent);
        }

        textarea { min-height: 90px; resize: vertical; }

        .actions { display: flex; justify-content: flex-end; gap: 12px; }

        button {
            padding: 12px 20px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            font: bold 0.95rem Arial, sans-serif;
            cursor: pointer;
        }

        button[type="reset"] { color: var(--accent-dark); background: transparent; }
        button[type="submit"] { color: #ffffff; background: var(--accent); }
        button:hover { background: var(--accent-dark); }
        button[type="reset"]:hover { color: #ffffff; }

        @media (max-width: 600px) {
            main { padding: 24px 18px; }
            fieldset { grid-template-columns: 1fr; padding: 16px; }
            .full-width { grid-column: auto; }
            .actions { flex-direction: column-reverse; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <main>
        <h1>College Registration</h1>
        <p class="intro">Complete the form below to begin your college application.</p>

        <form action="#" method="post">
            <fieldset>
                <legend>Personal information</legend>
                <div>
                    <label for="first-name">First name</label>
                    <input id="first-name" name="first_name" type="text" autocomplete="given-name" required>
                </div>
                <div>
                    <label for="last-name">Last name</label>
                    <input id="last-name" name="last_name" type="text" autocomplete="family-name" required>
                </div>
                <div>
                    <label for="date-of-birth">Date of birth</label>
                    <input id="date-of-birth" name="date_of_birth" type="date" required>
                </div>
                <div>
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select an option</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                        <option value="non-binary">Non-binary</option>
                        <option value="prefer-not-to-say">Prefer not to say</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Contact information</legend>
                <div>
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div>
                    <label for="phone">Phone number</label>
                    <input id="phone" name="phone" type="tel" autocomplete="tel" required>
                </div>
                <div class="full-width">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" autocomplete="street-address" required></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Academic details</legend>
                <div>
                    <label for="course">Choose a course</label>
                    <select id="course" name="course" required>
                        <option value="">Select a course</option>
                        <option value="computer-science">Computer Science</option>
                        <option value="business-administration">Business Administration</option>
                        <option value="engineering">Engineering</option>
                        <option value="arts">Arts and Humanities</option>
                        <option value="natural-sciences">Natural Sciences</option>
                    </select>
                </div>
                <div>
                    <label for="graduation-year">Graduation year</label>
                    <input id="graduation-year" name="graduation_year" type="number" min="1900" max="2100" required>
                </div>
            </fieldset>

            <div class="actions">
                <button type="reset">Clear form</button>
                <button type="submit">Submit registration</button>
            </div>
        </form>
    </main>
</body>
</html>
